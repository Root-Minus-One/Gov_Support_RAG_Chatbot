name: Build and Deploy RAG Application

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Authenticate directly against your ACR container vault
      - name: Authenticate to ACR Vault
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Build your custom Python RAG image and push it to Azure
      - name: Build and Push Core Container
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/rag-backend-app:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/rag-backend-app:latest

      # 4. Force Azure to drop the 0-scale cache and deploy the image
      - name: Force Azure Revision Update
        uses: azure/container-apps-deploy-action@v1
        with:
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}
          acrName: ${{ secrets.ACR_USERNAME }}
          resourceGroup: experiment
          containerAppName: rag-backend-app
          containerName: rag-backend-app
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/rag-backend-app:latest
          disableWorkflowAuth: true