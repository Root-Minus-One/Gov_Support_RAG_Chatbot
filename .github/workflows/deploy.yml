name: Build and Deploy RAG Application

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Authenticate directly against your ACR container vault
      - name: Authenticate to ACR Vault
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Build your custom Python RAG image and tag it as 'latest'
      - name: Build and Push Core Container
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/rag-backend-app:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/rag-backend-app:latest